services:
  db:
    image: postgres:15-alpine
    container_name: infra-pm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infra_user
      POSTGRES_PASSWORD: infra_password
      POSTGRES_DB: infra_pm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra_user -d infra_pm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
